name: dayflower
description: Connecting hearts, one kiss at a time.
publish_to: none
version: 1.0.0+36
environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Backend ──────────────────────────────────
  supabase_flutter: ^2.12.4

  # ── State management ─────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ───────────────────────────────
  go_router: ^13.2.5

  # ── UI & fonts ───────────────────────────────
  google_fonts: ^8.0.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # ── Image / Camera ───────────────────────────
  image_picker: ^1.0.7
  image_cropper: ^12.2.1

  # ── Notifications & haptics ───────────────────
  flutter_local_notifications: ^21.0.0
  vibration: ^3.1.8

  # ── Home screen widget ────────────────────────
  home_widget: ^0.9.1

  # ── Utilities ────────────────────────────────
  intl: ^0.20.2
  timezone: ^0.11.0 # IANA database for the dual clocks
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  connectivity_plus: ^7.1.1
  flutter_dotenv: ^6.0.1
  timeago: ^3.6.1
  collection: ^1.18.0
  device_preview: ^1.2.0
  camera: ^0.12.0+2

  # ── In-app updater (see lib/features/updates/) ─
  package_info_plus: ^10.2.1 # the installed build number, at runtime
  path_provider: ^2.1.6 # where the downloaded APK lands
  open_filex: ^4.7.0 # hands the APK to Android's installer
  image: ^4.9.2

  # Hands the rendered Insights PNG to Android's own share sheet. Declares
  # its own FileProvider, so no manifest change is needed here — but see
  # PROGRESS.md § Android builds: adding ANY plugin can leave a stale
  # Kotlin build cache that fails with a misleading "cannot find symbol".
  share_plus: ^13.3.0

  # ── Calls (see lib/features/calls/) ───────────────
  # Carries voice and video. Chosen over Daily because its Flutter client
  # runs on **web**, which keeps calls testable in `flutter run -d
  # web-server` — Daily's Flutter SDK is mobile-only, so every call test
  # would mean a full APK on two phones in two countries.
  #
  # ⚠️ Pulls flutter_webrtc, which is a heavy native plugin. See PROGRESS.md
  # § Android builds: adding ANY plugin here can leave a stale Kotlin cache
  # that fails with a misleading "cannot find symbol". If the next Android
  # build breaks, clean before believing the error.
  livekit_client: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/flowers/
    - assets/fonts/
    - .env

# App launcher icon. Sources live in assets/icon/, which is deliberately NOT
# in the `assets:` list above — they are build-time inputs and would
# otherwise ship ~4 MB of build-time PNG inside every APK. The two files in
# assets/icon/src/ are the brand masters as delivered; everything beside them
# is derived. Rebuild with:
#   python tool/make_icons.py
#   dart run flutter_launcher_icons
#
# ⚠️ The foreground already carries its own margin, so the inset here is 0.
# The mark sits at 47% of the 108dp canvas — which is 71% of the inner 72dp
# the launcher actually shows, matching how the supplied artwork composes
# itself. Sizing against the full 108dp instead puts it at 96% of the visible
# window and the mask shaves its edges. The canvas is not the icon.
#
# The background is the artwork's own peach gradient rather than a flat
# colour, sampled from it, so the adaptive icon and the legacy one are the
# same picture. The monochrome layer is the silhouette, for Android 13+
# themed icons.
flutter_launcher_icons:
  image_path: "assets/icon/src/appicon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  ios: true
  remove_alpha_ios: true
